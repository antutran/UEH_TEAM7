# crc_team race settings for the real car. Start values: calibrate the camera first
# (see the team guide, chapter "Camera"), then tune the speeds on the track.
# Only the values that differ from the defaults in race_node.py are listed.

# Camera geometry until you run tools/calib_birdseye.py (measure on YOUR car):
cam_height: 0.12         # lens height above the floor (m)
cam_x: 0.10              # lens ahead of the wheel axle (m)
cam_pitch_deg: 20.0      # downward tilt of the camera (degrees)
# After calibration paste the two lines printed by calib_birdseye.py here:
# birdseye_points: [...]
# birdseye_ground: [...]

lane_width: 0.425        # line centre to line centre: 400 mm lane + 25 mm line
line_width: 0.025
max_speed: 0.20          # start slow; raise step by step once the car is clean
min_speed: 0.08
lookahead: 0.45
